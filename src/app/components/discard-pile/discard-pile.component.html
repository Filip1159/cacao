<div class="table">
	<app-draw-pile></app-draw-pile>
	<div class="discard">
		<app-card [card]="game.top()"></app-card>
		<div class="effects">
			@let obligation = state().obligation;
			@switch (obligation.kind) {
				@case ("pick") {
					<span class="call"
						>Cards to pick: {{ obligation.count }}</span
					>
				}
				@case ("miss") {
					<span class="call"
						>Turns to miss: {{ obligation.turns }}</span
					>
				}
				@case ("rank") {
					<span class="call">Called rank: {{ obligation.rank }}</span>
				}
				@case ("suit") {
					<span class="call">Called suit: {{ obligation.suit }}</span>
				}
			}
		</div>
	</div>
</div>
