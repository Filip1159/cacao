<div class="card" [class]="{ 'card--disabled': disabled }">
	<span
		class="number"
		[class]="{ 'number--red': isRed, 'number--black': isBlack }"
		>{{ card.rank.toString() }}</span
	>
	<span
		class="suit"
		[class]="{ 'suit--red': isRed, 'suit--black': isBlack }"
		>{{ card.suit }}</span
	>
	<span class="pip" [class]="{ 'pip--red': isRed, 'pip--black': isBlack }">{{
		card.suit
	}}</span>
	<span
		class="suit suit--upside_down"
		[class]="{ 'suit--red': isRed, 'suit--black': isBlack }"
		>{{ card.suit }}</span
	>
	<span
		class="number number--upside_down"
		[class]="{ 'number--red': isRed, 'number--black': isBlack }"
		>{{ card.rank.toString() }}</span
	>
</div>
