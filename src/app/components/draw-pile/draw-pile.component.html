<button
	class="draw-pile"
	[class.draw-pile--hint]="
		game.isMyTurn() && game.canHumanPick() && !game.hasCounter()
	"
	[attr.aria-label]="'Draw pile, ' + game.deckSize() + ' cards'"
	[disabled]="!game.canHumanPick()"
	(click)="game.pick()"
>
	<app-card-face-down></app-card-face-down>
	<span class="draw-pile__count">Deck: {{ game.deckSize() }}</span>
</button>
