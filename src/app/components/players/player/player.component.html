<div id="player_cards">
	@for (c of cards; track c) {
		<app-card
			#card
			[card]="c"
			(click)="onCardClick(c)"
			[disabled]="!isLegalMove(c) || !isMyTurn()"
		></app-card>
	}
	<button
		(click)="pickCardFromStack()"
		[disabled]="isPickCardDisabled(turn$ | async)"
	>
		Pick card
	</button>
	<button (click)="missTurn()" [disabled]="!doesMissTurn()">
		Miss turn :(
	</button>
	<span>{{ state }}</span>
	<app-suit-called-modal
		(onSelected)="onSuitSelected($event)"
		[visible]="showSuitCalledModal"
	></app-suit-called-modal>
	<app-card-called-modal
		(onSelected)="onRankSelected($event)"
		[visible]="showCardCalledModal"
	></app-card-called-modal>
</div>
