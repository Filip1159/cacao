<header class="header">
	<h1 class="header__title">Cacao - the Macau game app</h1>
	<div class="header__buttons">
		<label class="header__difficulty">
			Bot
			<select
				aria-label="Bot difficulty"
				(change)="setDifficulty($event)"
			>
				@for (level of difficulties; track level) {
					<option [value]="level" [selected]="level === difficulty()">
						{{ level }}
					</option>
				}
			</select>
		</label>
		<button class="header__rules" (click)="showRules.set(true)">
			Rules
		</button>
		<button class="header__restart" (click)="restart()">New game</button>
	</div>
</header>
<app-game-over></app-game-over>
<app-rules-modal
	[visible]="showRules()"
	(closed)="showRules.set(false)"
></app-rules-modal>
<main class="game">
	<app-opponent></app-opponent>
	<div class="game__middle">
		<app-discard-pile></app-discard-pile>
		<app-status></app-status>
	</div>
	<app-player></app-player>
</main>
